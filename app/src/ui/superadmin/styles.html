<style>
    table { table-layout: fixed; word-wrap: break-word; }
    th, td { padding: 8px 4px; }

    input[type="file"] {
        display: block;
        width: 100%;
        padding: 0.5rem;
        margin-top: 0.5rem;
        border: 1px solid #d1d5db;
        border-radius: 0.375rem;
        background-color: #f9fafb;
        cursor: pointer;
    }
    input[type="file"]::file-selector-button {
        padding: 0.5rem 1rem;
        margin-right: 0.5rem;
        border: none;
        border-radius: 0.375rem;
        background-color: #4f46e5;
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
    }
    input[type="file"]::file-selector-button:hover {
        background-color: #4338ca;
    }

    .lang-switcher a {
        cursor: pointer;
        text-decoration: underline;
        margin: 0 5px;
    }
    .lang-switcher a.active {
        font-weight: bold;
        text-decoration: none;
        cursor: default;
    }

    /* === NEW: Responsive Table Styles === */
    @media (max-width: 1024px) { /* Adjust breakpoint as needed */
        /* Force table elements to behave like blocks */
        table, thead, tbody, th, td, tr {
            display: block;
        }

        /* Hide table headers (but not display: none;, for accessibility) */
        thead tr {
            position: absolute;
            top: -9999px;
            left: -9999px;
        }

        tr {
            border: 1px solid #ccc;
            margin-bottom: 0.5rem; /* Add space between stacked rows */
            border-radius: 4px; /* Optional: rounded corners for blocks */
            background-color: #f9f9f9; /* Optional: background for blocks */
        }

        td {
            /* Behave like a "row" */
            border: none;
            border-bottom: 1px solid #eee;
            position: relative;
            padding-left: 50%; /* Make space for the label */
            text-align: right; /* Align cell content to the right */
            white-space: normal; /* Allow content wrapping */
            min-height: 2.5em; /* Ensure cells have some height */
            display: flex; /* Use flex for better vertical alignment */
            align-items: center; /* Vertically center content */
            justify-content: flex-end; /* Align content to the end (right) */
        }
        td:last-child {
             border-bottom: 0;
        }

        td::before {
            /* Now like a table header */
            position: absolute;
            /* Top/left values mimic padding */
            top: 0;
            left: 6px;
            width: 45%; /* Reserve space for the label */
            padding-right: 10px;
            white-space: nowrap; /* Prevent label wrapping */
            content: attr(data-label); /* Use the data-label attribute */
            font-weight: bold;
            text-align: left; /* Align label text to the left */
            height: 100%; /* Match cell height */
            display: flex; /* Use flex for vertical alignment */
            align-items: center; /* Vertically center label */
        }

         /* Adjust specific columns for better responsive display */
         td[data-label*="Link"], /* Target Public and Admin Link */
         td[data-label*="URL"] { /* Target Friendly URL */
            word-break: break-all; /* Allow long links to break */
         }
         td[data-label*="Actions"] { /* Center the delete button */
             justify-content: center;
             padding-left: 6px; /* Reset padding-left */
             text-align: center;
         }
         td[data-label*="Actions"]::before {
              display: none; /* Hide label for actions column */
         }
         /* Remove fixed widths in responsive view */
         th, td {
             width: auto !important;
         }
    }
    /* === END NEW === */
</style>
